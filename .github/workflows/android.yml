name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build, lint and unit tests
        run: ./gradlew assembleDebug assembleRelease lint testDebugUnitTest --console=plain

      - name: Check release permissions
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk")
          echo "$permissions"
          if echo "$permissions" | grep -q "android.permission.INTERNET"; then
            echo "::error::Release APK requests INTERNET permission"
            exit 1
          fi

      - name: Check 16 KB alignment
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run engine tests (desktop, ground truth)
        run: |
          cmake -S engine -B build/engine-desktop -DCMAKE_BUILD_TYPE=Release -DLUMA_ENGINE_TESTS=ON
          cmake --build build/engine-desktop --parallel
          ./build/engine-desktop/luma_engine_tests
